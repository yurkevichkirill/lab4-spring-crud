# Профиль test: H2 in-memory в режиме совместимости с MySQL (тесты не требуют Docker).
# Flyway включён и применяет те же миграции db/migration, Hibernate только валидирует схему.
spring:
  datasource:
    url: jdbc:h2:mem:football;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
